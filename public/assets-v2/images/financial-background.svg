<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="chartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00a8ff;stop-opacity:0.4" />
    </linearGradient>
    
    <linearGradient id="coinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ffb347;stop-opacity:0.6" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>
  
  <!-- Geometric patterns -->
  <g opacity="0.1">
    <circle cx="200" cy="150" r="80" fill="none" stroke="#00d4aa" stroke-width="2"/>
    <circle cx="1700" cy="900" r="120" fill="none" stroke="#00a8ff" stroke-width="2"/>
    <polygon points="100,300 200,250 300,350 200,400" fill="none" stroke="#ffd700" stroke-width="2"/>
    <polygon points="1600,200 1750,150 1850,300 1700,350" fill="none" stroke="#00d4aa" stroke-width="2"/>
  </g>
  
  <!-- Financial chart lines -->
  <g opacity="0.6" filter="url(#glow)">
    <path d="M50,800 Q200,700 350,750 T650,650 T950,600 T1250,550 T1550,500 T1850,450" 
          fill="none" stroke="url(#chartGradient)" stroke-width="3"/>
    <path d="M50,900 Q150,850 250,880 T450,820 T650,780 T850,740 T1050,700 T1250,660 T1450,620 T1650,580 T1850,540" 
          fill="none" stroke="#00a8ff" stroke-width="2" opacity="0.8"/>
    <path d="M50,950 Q100,920 200,940 T400,900 T600,860 T800,820 T1000,780 T1200,740 T1400,700 T1600,660 T1850,620" 
          fill="none" stroke="#00d4aa" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Chart bars -->
  <g opacity="0.4">
    <rect x="100" y="850" width="15" height="100" fill="#00d4aa"/>
    <rect x="130" y="820" width="15" height="130" fill="#00a8ff"/>
    <rect x="160" y="880" width="15" height="70" fill="#ffd700"/>
    <rect x="190" y="800" width="15" height="150" fill="#00d4aa"/>
    <rect x="220" y="840" width="15" height="110" fill="#00a8ff"/>
    
    <rect x="1650" y="200" width="15" height="80" fill="#00d4aa"/>
    <rect x="1680" y="180" width="15" height="100" fill="#00a8ff"/>
    <rect x="1710" y="220" width="15" height="60" fill="#ffd700"/>
    <rect x="1740" y="160" width="15" height="120" fill="#00d4aa"/>
  </g>
  
  <!-- Floating coins -->
  <g opacity="0.3">
    <circle cx="300" cy="200" r="25" fill="url(#coinGradient)" filter="url(#glow)"/>
    <text x="300" y="208" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="20" font-weight="bold">$</text>
    
    <circle cx="1500" cy="300" r="20" fill="url(#coinGradient)" filter="url(#glow)"/>
    <text x="1500" y="307" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="16" font-weight="bold">€</text>
    
    <circle cx="150" cy="500" r="18" fill="url(#coinGradient)" filter="url(#glow)"/>
    <text x="150" y="506" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="14" font-weight="bold">¥</text>
    
    <circle cx="1750" cy="700" r="22" fill="url(#coinGradient)" filter="url(#glow)"/>
    <text x="1750" y="707" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="18" font-weight="bold">₿</text>
  </g>
  
  <!-- Growth arrows -->
  <g opacity="0.5" filter="url(#glow)">
    <path d="M400,600 L450,550 L440,560 L450,550 L460,560" fill="none" stroke="#00d4aa" stroke-width="3"/>
    <path d="M800,400 L850,350 L840,360 L850,350 L860,360" fill="none" stroke="#00a8ff" stroke-width="3"/>
    <path d="M1200,300 L1250,250 L1240,260 L1250,250 L1260,260" fill="none" stroke="#ffd700" stroke-width="3"/>
  </g>
  
  <!-- Financial symbols scattered -->
  <g opacity="0.2" fill="#00d4aa" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
    <text x="500" y="150">%</text>
    <text x="1300" y="800">∑</text>
    <text x="700" y="950">π</text>
    <text x="1100" y="100">∞</text>
    <text x="50" y="400">±</text>
    <text x="1800" y="500">∆</text>
  </g>
  
  <!-- Candlestick chart elements -->
  <g opacity="0.4">
    <rect x="600" y="700" width="8" height="40" fill="#00d4aa"/>
    <line x1="604" y1="680" x2="604" y2="760" stroke="#00d4aa" stroke-width="2"/>
    
    <rect x="620" y="720" width="8" height="30" fill="#ff6b6b"/>
    <line x1="624" y1="710" x2="624" y2="760" stroke="#ff6b6b" stroke-width="2"/>
    
    <rect x="640" y="690" width="8" height="50" fill="#00d4aa"/>
    <line x1="644" y1="670" x2="644" y2="760" stroke="#00d4aa" stroke-width="2"/>
    
    <rect x="660" y="710" width="8" height="35" fill="#00d4aa"/>
    <line x1="664" y1="690" x2="664" y2="760" stroke="#00d4aa" stroke-width="2"/>
  </g>
  
  <!-- Network connections -->
  <g opacity="0.3" stroke="#00a8ff" stroke-width="1" fill="none">
    <line x1="300" y1="200" x2="500" y2="150"/>
    <line x1="500" y1="150" x2="700" y2="950"/>
    <line x1="1500" y1="300" x2="1300" y2="800"/>
    <line x1="1750" y1="700" x2="1100" y2="100"/>
    <circle cx="500" cy="150" r="3" fill="#00a8ff"/>
    <circle cx="700" cy="950" r="3" fill="#00a8ff"/>
    <circle cx="1300" cy="800" r="3" fill="#00a8ff"/>
    <circle cx="1100" cy="100" r="3" fill="#00a8ff"/>
  </g>
  
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#00d4aa" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
</svg>